name: BilingualTranslator
options:
  bundleIdPrefix: com.shichang4fun
  deploymentTarget:
    iOS: "17.0"
  knownRegions: [en, zh-Hans]
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "3"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: "2LB76PD797"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  BilingualTranslator:
    type: application
    platform: iOS
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shichang4fun.Bilingual-Translator
        INFOPLIST_KEY_CFBundleDisplayName: Bilingual Translator
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: BilingualTranslatorExtension
        embed: true
  BilingualTranslatorExtension:
    type: app-extension
    platform: iOS
    sources:
      - Extension
      - ../../dist-safari-ios/manifest.json
      - ../../dist-safari-ios/background.html
      - ../../dist-safari-ios/background.js
      - ../../dist-safari-ios/options.html
      - ../../dist-safari-ios/popup.html
      - path: ../../dist-safari-ios/assets
        type: folder
      - path: ../../dist-safari-ios/src
        type: folder
      - path: ../../dist-safari-ios/icons
        type: folder
      - App/PrivacyInfo.xcprivacy
    info:
      path: Extension/Info.plist
      properties:
        CFBundleDisplayName: Bilingual Translator
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shichang4fun.Bilingual-Translator.Extension
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
  BilingualTranslatorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: BilingualTranslator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shichang4fun.Bilingual-Translator.UITests
schemes:
  BilingualTranslator:
    build:
      targets:
        BilingualTranslator: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets: [BilingualTranslatorUITests]
